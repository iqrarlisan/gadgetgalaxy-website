
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | GadgetGalaxy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0c1224;
      color: #f5f7ff;
    }

    header {
      background: #121c34;
      padding: 15px 20px;
      border-bottom: 1px solid #293650;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      width: 150px;
      max-width: 45%;
      height: auto;
    }

    .back-link {
      color: #62e8df;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .product-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      background: #151f36;
      border: 1px solid #293650;
      border-radius: 14px;
      padding: 25px;
    }

    .product-image {
      width: 100%;
      min-height: 300px;
      max-height: 480px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 10px;
    }

    .product-info {
      padding: 10px 0;
    }

    .category {
      color: #62e8df;
      font-size: 14px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.3;
      margin: 0 0 15px;
    }

    .brand {
      color: #b9c5dc;
      margin-bottom: 18px;
    }

    .price {
      color: #62e8df;
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0;
    }

    .description {
      color: #d3daea;
      line-height: 1.7;
    }

    h2 {
      font-size: 19px;
      margin-top: 25px;
    }

    .specifications {
      padding-left: 20px;
      color: #d3daea;
      line-height: 1.9;
    }

    .contact-button {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 22px;
      background: #62e8df;
      color: #0c1224;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    .contact-button:hover {
      opacity: 0.9;
    }

    .not-found {
      text-align: center;
      padding: 60px 20px;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #aab6ce;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .product-container {
        grid-template-columns: 1fr;
        padding: 18px;
        gap: 20px;
      }

      .product-image {
        min-height: 230px;
        max-height: 350px;
      }

      h1 {
        font-size: 23px;
      }

      main {
        margin: 20px auto;
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <a href="index.html">
        <img
          src="GadgetGalaxy Cosmic Neon Logo.png"
          alt="GadgetGalaxy"
          class="logo"
        >
      </a>

      <a href="index.html#products" class="back-link">
        ← Back to Products
      </a>
    </div>
  </header>

  <main>
    <div id="productDetails">
      <div class="not-found">
        Loading product details...
      </div>
    </div>
  </main>

  <footer>
    © <span id="currentYear"></span> GadgetGalaxy. All rights reserved.
  </footer>

  <script src="products.js"></script>
  <script src="product.js"></script>

</body>
</html>
