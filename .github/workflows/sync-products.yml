
name: Sync GadgetGalaxy Products

on:
  push:
    branches:
      - main
    paths:
      - 'products.js'
      - '.github/workflows/sync-products.yml'

  workflow_dispatch:

jobs:
  sync-products:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync products to Cloudflare D1
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          WORKER_URL: https://gadgetgalaxy-api.iqrarlisan206.workers.dev
        run: |
          node -e '
          const products = require("./products.js");

          fetch(process.env.WORKER_URL + "/sync-products", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + process.env.SYNC_SECRET
            },
            body: JSON.stringify({ products })
          })
          .then(async response => {
            const result = await response.json();
            console.log(result);
            if (!response.ok) {
              throw new Error("Product sync failed");
            }
          })
          .catch(error => {
            console.error(error);
            process.exit(1);
          });
          '
